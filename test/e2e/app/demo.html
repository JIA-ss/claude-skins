<!doctype html><html lang="en"><head><meta charset="utf-8"><title>mock claude.ai — new chat</title>
<!-- Clean "new chat" screen used only for recording the demo: no chat history, no recents, nothing personal.
     Same hooks as page.html (CSS variables, backing panels, data-cds=ChatComposer, data-testid=sidebar). -->
<style>
 :root{--accent-brand:15 63.1% 59.6%;--cds-fill-brand:#c6613f;--cds-on-accent:#fff;--danger-000:0 70% 50%}
 html{background:#1f1e1d} html > :not(head):not(body){display:none !important}
 body{margin:0;background:#1f1e1d;color:#e8e6e3;font:15px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
 .wrap{display:flex;height:100vh}
 aside{position:relative;width:240px;background:#1a1918;padding:10px 8px;box-sizing:border-box}
 .row{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;color:#c9c6c0;font-size:14px}
 .ico{width:16px;height:16px;border-radius:4px;background:#3a3936;flex:0 0 auto}
 main{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
 h1{position:relative;font:400 34px/1.2 Georgia,"Times New Roman",serif;color:#ece9e3;margin:0 0 112px;letter-spacing:.01em}
 h1 span{color:hsl(var(--accent-brand))}
 .composer{position:relative;width:700px}
 .composer .bg-surface-3{background:#30302e;border-radius:18px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #3d3c39}
 .ed{padding:14px 16px 0;outline:none;min-height:30px;color:#f2efe9}
 .ed:empty:before{content:"How can I help you today?";color:#7d7a74}
 .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px}
 .btn{background:var(--cds-fill-brand);color:var(--cds-on-accent);border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px}
 .chips{position:relative;display:flex;gap:8px;margin-top:16px}
 .chip{border:1px solid #3d3c39;border-radius:10px;padding:5px 12px;font-size:13px;color:#b9b5ae;background:#262624}
</style></head><body>
<div class="wrap" style="background:#1f1e1d;position:relative"><div class="pointer-events-none" style="pointer-events:none;position:absolute;inset:0;background:#1f1e1d"></div>
<aside><div data-testid="sidebar" style="display:flex;flex-direction:column">
 <div class="row"><span class="ico"></span>New chat</div><div class="row"><span class="ico"></span>Search</div><div class="row"><span class="ico"></span>Projects</div>
</div></aside>
<main><div class="tiles-shell" style="pointer-events:none;position:absolute;inset:0;background-color:color(srgb 0.122 0.118 0.114)"></div>
 <h1><span>✻</span> Good evening</h1>
 <div class="composer" data-cds="ChatComposer"><div class="bg-surface-3"><div class="ed" contenteditable="true"></div><div class="bar"><span style="color:#8f8b84;font-size:13px">＋</span><button class="btn" data-cds="Button">↑</button></div></div></div>
 <div class="chips"><span class="chip">Write</span><span class="chip">Learn</span><span class="chip">Code</span><span class="chip">Life stuff</span></div>
</main></div>
</body></html>
